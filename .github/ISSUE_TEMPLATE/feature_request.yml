name: Feature request
description: Propose a user-facing capability or product improvement.
title: "feat: "
labels:
  - type: feature
  - status: triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you want, not only the implementation you have in mind.
  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: What should AllTools be able to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: Who needs this and what becomes easier or possible?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: Explain the intended workflow from input to output.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write observable conditions that prove the work is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop shell
        - React UI
        - Settings and preferences
        - PDF tools
        - Image tools
        - Document tools
        - Plugin lifecycle
        - Packaging
        - Other
    validations:
      required: true
  - type: dropdown
    id: repository
    attributes:
      label: Primary repository
      options:
        - alltools-app
        - alltools-plugins
        - Both repositories
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add references, screenshots, examples, constraints, or related issues.
    validations:
      required: false
